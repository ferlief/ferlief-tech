<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projetos — ferlief.tech</title>
  <script>
    try {
      const tema = localStorage.getItem('tema');
      if (tema === 'light' || tema === 'dark') {
        document.documentElement.dataset.theme = tema;
      }
      const idioma = localStorage.getItem('idioma');
      if (idioma === 'pt' || idioma === 'en') {
        document.documentElement.dataset.lang = idioma;
        document.documentElement.lang = idioma === 'pt' ? 'pt-BR' : 'en';
      }
    } catch {}
  </script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/atividade.css">
  <link rel="stylesheet" href="/css/paginas.css">
</head>
<body>
  <header>
    <h1 class="logo"><a href="/">ferlief.tech</a></h1>
    <nav class="site-nav" aria-label="Navegação do site" data-i18n-aria-label="nav.site">
      <a href="/" data-i18n="nav.inicio">Início</a>
      <a href="/experiencia/" data-i18n="nav.experiencia">Experiência</a>
      <a href="/projetos/" aria-current="page" data-i18n="nav.projetos">Projetos</a>
      <a href="/blog/" data-i18n="nav.blog">Blog</a>
    </nav>
    <button id="btn-tema" class="btn-tema" type="button" aria-pressed="false">
      <span class="shape shape-lua" aria-hidden="true"></span>
      <span id="btn-tema-label">Modo claro</span>
    </button>
    <button id="btn-idioma" class="btn-idioma" type="button" aria-pressed="false">
      <span class="shape shape-bandeira-uk" aria-hidden="true"></span>
      <span id="btn-idioma-label">English</span>
    </button>
  </header>

  <main class="pagina">
    <h2 class="pagina-titulo" data-i18n="proj.titulo">Projetos</h2>
    <p class="pagina-intro" data-i18n="proj.introTexto">Repositórios abertos, um projeto por pasta.</p>

    <div id="projetos-lista" class="projetos-lista"></div>
  </main>

  <footer id="atividade-root"></footer>

  <script type="module" src="/js/tema.js"></script>
  <script type="module" src="/js/idioma.js"></script>
  <script type="module" src="/js/projetos.js"></script>
  <script type="module" src="/js/atividade.js"></script>
</body>
</html>
